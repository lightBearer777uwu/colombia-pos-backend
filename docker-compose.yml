services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tienda
      POSTGRES_USER: tienda
      POSTGRES_PASSWORD: tienda-local-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tienda-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tienda -d tienda"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tienda-postgres-data:
